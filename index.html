<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>People</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --fog: #e8eef1;
      --ink: #13232e;
      --muted: #5b6e7a;
      --steel: #1f5f6b;
      --deep: #0f2a33;
      --signal: #f2b705;
      --danger: #b3261e;
      --line: #d3dce1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fog);
      color: var(--ink);
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ---------- header band ---------- */
    .top {
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.045) 0 3px, transparent 3px 22px),
        var(--deep);
      color: #fff;
      padding: 2.6rem 1rem 5.5rem;
    }
    .wrap { width: min(1080px, 100%); margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 0.7rem; font-weight: 800; letter-spacing: 0.02em; opacity: 0.9; }
    .mark { width: 30px; height: 20px; background: var(--steel); border: 3px solid var(--signal); border-radius: 2px; }
    .top h1 { font-size: clamp(2.2rem, 6vw, 3.8rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1; margin: 1.6rem 0 0.5rem; }
    .top p { margin: 0; color: #b7c8cf; font-size: 1.1rem; }
    .top p b { color: var(--signal); }

    /* ---------- toolbar ---------- */
    .toolbar {
      display: flex; gap: 0.8rem; flex-wrap: wrap;
      margin-top: -2.6rem;
      background: #fff;
      padding: 0.8rem;
      border-radius: 8px;
      box-shadow: 0 14px 30px -14px rgba(15, 42, 51, 0.45);
    }
    .search { flex: 1 1 240px; position: relative; }
    .search svg { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .search input { padding-left: 2.6rem; width: 100%; }

    input {
      font: inherit;
      padding: 0.75rem 0.85rem;
      border: 2px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      transition: border-color 0.15s;
    }
    input:focus-visible { outline: 3px solid var(--signal); border-color: var(--ink); }

    button { font: inherit; cursor: pointer; border: 0; }
    button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    .btn {
      font-weight: 800;
      padding: 0.75rem 1.4rem;
      border-radius: 6px;
      background: var(--signal);
      color: var(--ink);
      transition: transform 0.12s, filter 0.12s;
    }
    .btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .btn.ghost { background: transparent; border: 2px solid var(--line); }
    .btn.danger { background: var(--danger); color: #fff; }

    /* ---------- cards ---------- */
    main { padding: 2rem 1rem 4rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1.2rem; }
    .card {
      --c: var(--steel);
      background: #fff;
      border-radius: 8px;
      border-top: 6px solid var(--c);
      padding: 1.3rem 1.3rem 1rem;
      display: flex; flex-direction: column; gap: 0.9rem;
      box-shadow: 0 10px 24px -16px rgba(15, 42, 51, 0.5);
      animation: rise 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      animation-delay: calc(var(--i, 0) * 45ms);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 18px 30px -16px rgba(15, 42, 51, 0.55); }
    .head { display: flex; gap: 0.9rem; align-items: center; }
    .avatar {
      flex: none;
      width: 54px; height: 54px; border-radius: 50%;
      background: var(--c); color: #fff;
      display: grid; place-items: center;
      font-weight: 800; font-size: 1.4rem;
    }
    .who { min-width: 0; }
    .who h3 { margin: 0; font-size: 1.2rem; font-weight: 800; overflow-wrap: anywhere; }
    .who span { color: var(--muted); font-size: 0.95rem; }
    .email { color: var(--steel); font-weight: 500; overflow-wrap: anywhere; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; min-height: 1.6rem; }
    .tag { background: #e3eef0; color: var(--steel); font-size: 0.85rem; font-weight: 500; padding: 0.2rem 0.65rem; border-radius: 99px; }
    .none { color: var(--muted); font-size: 0.9rem; }
    .acts { display: flex; gap: 0.4rem; margin-top: auto; border-top: 1px solid var(--line); padding-top: 0.7rem; }
    .link { background: none; padding: 0.35rem 0.7rem; border-radius: 5px; font-weight: 800; color: var(--steel); }
    .link:hover { background: #e3eef0; }
    .link.del { color: var(--danger); margin-left: auto; }
    .link.del:hover { background: #fbe9e7; }

    .state { text-align: center; padding: 4rem 1rem; color: var(--muted); }
    .state h2 { color: var(--ink); margin: 0 0 0.5rem; font-size: 1.6rem; }
    .state .btn { margin-top: 1.2rem; }

    /* ---------- dialogs ---------- */
    dialog {
      border: 0; padding: 0; border-radius: 10px;
      width: min(480px, 92vw);
      color: var(--ink);
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.5);
    }
    dialog[open] { animation: pop 0.22s cubic-bezier(0.2, 0.8, 0.2, 1); }
    dialog::backdrop { background: rgba(10, 24, 30, 0.6); }
    .dlg { padding: 1.6rem; }
    .dlg h2 { margin: 0 0 1.2rem; font-size: 1.5rem; font-weight: 800; }
    .dlg label { display: grid; gap: 0.3rem; font-weight: 500; margin-bottom: 1rem; }
    .dlg small { color: var(--muted); font-weight: 400; }
    .err { color: var(--danger); font-weight: 500; min-height: 1.3rem; margin: 0 0 0.6rem; }
    .row { display: flex; gap: 0.7rem; justify-content: flex-end; }

    /* ---------- toast ---------- */
    .toast {
      position: fixed; left: 50%; bottom: 1.6rem;
      transform: translate(-50%, 140%);
      background: var(--deep); color: #fff;
      padding: 0.8rem 1.3rem; border-radius: 8px; font-weight: 500;
      border-left: 5px solid var(--signal);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 50;
    }
    .toast.show { transform: translate(-50%, 0); }
    .toast.bad { border-left-color: var(--danger); }

    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @keyframes pop { from { opacity: 0; transform: scale(0.94); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand"><span class="mark"></span> PEOPLE</div>
      <h1>Everyone, one place.</h1>
      <p id="count">Loading…</p>
    </div>
  </header>

  <div class="wrap">
    <div class="toolbar">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Search name, email, role or interest" aria-label="Search users" autocomplete="off" />
      </div>
      <button class="btn" id="addBtn">+ Add user</button>
    </div>
  </div>

  <main>
    <div class="wrap">
      <div class="grid" id="grid"></div>
      <div class="state" id="state" hidden></div>
    </div>
  </main>

  <!-- add / edit dialog -->
  <dialog id="formDlg">
    <form class="dlg" id="form" novalidate>
      <h2 id="formTitle">Add user</h2>
      <label>Name <input id="fName" maxlength="80" autocomplete="off" /></label>
      <label>Email <input id="fEmail" type="email" maxlength="120" autocomplete="off" /></label>
      <label>Role <input id="fRole" maxlength="60" placeholder="e.g. Backend developer" autocomplete="off" /></label>
      <label>Interests <small>Separate with commas</small>
        <input id="fInterests" maxlength="200" placeholder="coding, cricket, music" autocomplete="off" />
      </label>
      <p class="err" id="formErr" role="alert"></p>
      <div class="row">
        <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn" id="saveBtn">Save</button>
      </div>
    </form>
  </dialog>

  <!-- delete confirm dialog -->
  <dialog id="delDlg">
    <div class="dlg">
      <h2>Delete this user?</h2>
      <p id="delText" style="margin:0 0 1.4rem"></p>
      <div class="row">
        <button class="btn ghost" id="delCancel">Keep</button>
        <button class="btn danger" id="delOk">Delete</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const COLORS = ["#1f5f6b", "#2f4b8a", "#6b3a7d", "#5a6b1f", "#8f5f06", "#3d4f5c", "#8a2f4b"];
    let users = [];
    let editingId = null;
    let deletingUser = null;

    // ---------- helpers ----------
    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined) n.textContent = text;
      return n;
    }
    function colorFor(name) {
      let h = 0;
      for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return COLORS[h % COLORS.length];
    }
    function tagsOf(u) {
      const raw = Array.isArray(u.interests) ? u.interests : String(u.interests || "").split(",");
      return raw.map((s) => String(s).trim()).filter(Boolean);
    }
    let toastTimer;
    function toast(text, bad) {
      const t = $("toast");
      t.textContent = text;
      t.className = "toast show" + (bad ? " bad" : "");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => (t.className = "toast"), 2600);
    }
    async function api(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
      });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch {}
      if (!res.ok || data === null) {
        throw new Error((data && data.error) || "Server replied " + res.status + ". Open this page via http://localhost:3000");
      }
      return data;
    }

    // ---------- render ----------
    function render() {
      const q = $("q").value.trim().toLowerCase();
      const list = users.filter((u) =>
        !q || [u.name, u.email, u.role, tagsOf(u).join(" ")].join(" ").toLowerCase().includes(q)
      );

      $("count").innerHTML = users.length
        ? "<b>" + (q ? list.length + " of " + users.length : users.length) + "</b> " + (users.length === 1 ? "person" : "people") + " in the database"
        : "No one added yet";

      const grid = $("grid");
      const state = $("state");
      grid.textContent = "";
      state.hidden = list.length > 0;

      if (!list.length) {
        state.textContent = "";
        if (!users.length) {
          state.append(el("h2", "", "No users yet"), el("p", "", "Add the first person to get started."));
          const b = el("button", "btn", "+ Add user");
          b.onclick = () => openForm(null);
          state.append(b);
        } else {
          state.append(el("h2", "", "No match"), el("p", "", "Nothing found for “" + $("q").value.trim() + "”."));
        }
        return;
      }

      list.forEach((u, i) => {
        const card = el("article", "card");
        card.style.setProperty("--c", colorFor(u.name));
        card.style.setProperty("--i", Math.min(i, 12));

        const head = el("div", "head");
        head.append(el("div", "avatar", (u.name || "?").trim().charAt(0).toUpperCase()));
        const who = el("div", "who");
        who.append(el("h3", "", u.name), el("span", "", u.role || "No role set"));
        head.append(who);

        const email = el("div", "email", u.email || "");

        const tags = el("div", "tags");
        const t = tagsOf(u);
        if (t.length) t.forEach((x) => tags.append(el("span", "tag", x)));
        else tags.append(el("span", "none", "No interests added"));

        const acts = el("div", "acts");
        const edit = el("button", "link", "Edit");
        edit.onclick = () => openForm(u);
        const del = el("button", "link del", "Delete");
        del.onclick = () => askDelete(u);
        acts.append(edit, del);

        card.append(head, email, tags, acts);
        grid.append(card);
      });
    }

    async function load() {
      try {
        users = await api("GET", "/api/users");
        render();
      } catch (e) {
        $("count").textContent = "Cannot reach the server";
        $("state").hidden = false;
        $("state").textContent = "";
        $("state").append(el("h2", "", "Could not load users"), el("p", "", e.message));
      }
    }

    // ---------- add / edit ----------
    function openForm(u) {
      editingId = u ? u._id : null;
      $("formTitle").textContent = u ? "Edit user" : "Add user";
      $("fName").value = u ? u.name || "" : "";
      $("fEmail").value = u ? u.email || "" : "";
      $("fRole").value = u ? u.role || "" : "";
      $("fInterests").value = u ? tagsOf(u).join(", ") : "";
      $("formErr").textContent = "";
      $("formDlg").showModal();
      $("fName").focus();
    }

    $("addBtn").onclick = () => openForm(null);
    $("cancelBtn").onclick = () => $("formDlg").close();

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = {
        name: $("fName").value,
        email: $("fEmail").value,
        role: $("fRole").value,
        interests: $("fInterests").value,
      };
      $("saveBtn").disabled = true;
      try {
        if (editingId) await api("PUT", "/api/users/" + editingId, body);
        else await api("POST", "/api/users", body);
        $("formDlg").close();
        toast(editingId ? "User updated" : "User added");
        await load();
      } catch (err) {
        $("formErr").textContent = err.message;
      } finally {
        $("saveBtn").disabled = false;
      }
    });

    // ---------- delete ----------
    function askDelete(u) {
      deletingUser = u;
      $("delText").textContent = u.name + " will be removed permanently.";
      $("delDlg").showModal();
    }
    $("delCancel").onclick = () => $("delDlg").close();
    $("delOk").onclick = async () => {
      try {
        await api("DELETE", "/api/users/" + deletingUser._id);
        $("delDlg").close();
        toast("User deleted");
        await load();
      } catch (err) {
        $("delDlg").close();
        toast(err.message, true);
      }
    };

    // close dialogs when clicking the dark backdrop
    document.querySelectorAll("dialog").forEach((d) =>
      d.addEventListener("click", (e) => { if (e.target === d) d.close(); })
    );

    $("q").addEventListener("input", render);
    load();
  </script>
</body>
</html>
